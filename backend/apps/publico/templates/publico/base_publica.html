{% load static %}<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block titulo %}Agendar{% endblock %} · {{ barbearia.nome }}</title>
  <meta name="theme-color" content="#0e2240">
  <link rel="manifest" href="{% url 'publico:manifesto_barbearia' barbearia.slug %}">
  <link rel="icon" href="{% static 'img/martinho-simbolo.svg' %}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{% static 'img/icone-180.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,700&family=Figtree:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/martinho.css' %}">
</head>
<body class="publico">
  <header class="publico__topo">
    <div class="publico__conteudo">
      <span class="rotulo publico__rotulo">Agendamento online</span>
      <h1 class="publico__nome">{{ barbearia.nome }}</h1>
      {% if barbearia.endereco %}<p class="publico__endereco">{{ barbearia.endereco }}</p>{% endif %}
    </div>
  </header>
  <main class="publico__conteudo publico__principal">
    {% block conteudo %}{% endblock %}
  </main>
  <footer class="publico__rodape">
    <img src="{% static 'img/martinho-simbolo.svg' %}" alt="" width="20" height="20">
    <span>Agendamento pelo Martinho</span>
  </footer>
  <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('{% url "publico:service_worker" %}'); }

    // App instalado não tem botão de recarregar, e o celular reabre a página
    // que ficou na memória. Ao voltar para a tela depois de 1 minuto, a página
    // é buscada de novo, para mostrar os horários de agora. Não recarrega se
    // o cliente já começou a digitar o nome ou o WhatsApp.
    (function () {
      var saiuEm = null;
      function digitando() {
        return Array.prototype.some.call(document.querySelectorAll('form input[type="text"], form input[type="tel"]'),
          function (campo) { return campo.value.trim() !== ''; });
      }
      function atualizar() { if (!digitando()) location.reload(); }
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) { saiuEm = Date.now(); return; }
        if (saiuEm && Date.now() - saiuEm > 60000) atualizar();
      });
      // Voltou pelo "voltar" do navegador com a página guardada na memória.
      window.addEventListener('pageshow', function (evento) { if (evento.persisted) atualizar(); });
    })();
  </script>
</body>
</html>
