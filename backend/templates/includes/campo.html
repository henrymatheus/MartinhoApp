<div class="campo{% if campo.errors %} campo--erro{% endif %}">
  <label for="{{ campo.id_for_label }}">{{ campo.label }}{% if not campo.field.required and not sem_opcional %} <span class="legenda">(opcional)</span>{% endif %}</label>
  {{ campo }}
  {% for erro in campo.errors %}<span class="campo__erro">{{ erro }}</span>{% endfor %}
  {% if campo.help_text and not campo.errors %}<span class="campo__ajuda">{{ campo.help_text }}</span>{% endif %}
</div>
